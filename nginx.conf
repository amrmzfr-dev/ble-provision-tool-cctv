server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache index.html so browsers always fetch the latest hashed bundle names.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxied server-side to this app's own mini backend (BleProvisionApi,
    # `backend/`), not straight to the camera backend anymore — that backend
    # holds the X-Admin-Key/login and forwards on to cctv.czeros.tech itself.
    # Browser -> here -> ble-backend:8080 -> cctv.czeros.tech. Same-origin
    # from the browser's point of view either way, so no CORS config needed.
    location /api/ {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://ble-backend:8080/api/;

        # The /api/stream/* and /api/admin/stream/* endpoints are
        # effectively-infinite live responses — nginx's default
        # proxy_buffering accumulates the whole thing before forwarding any
        # of it downstream, so the browser sees nothing (StreamScreen sat at
        # "0 chunks, 0.0 KB" forever even though the backend was genuinely
        # sending frames the whole time, confirmed by curling the real
        # backend directly). Disabled so bytes flush through as they arrive.
        # Also raised the read timeout past nginx's 60s default so an idle
        # stream connection isn't killed mid-test.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;
}
