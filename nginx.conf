server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache index.html so browsers always fetch the latest hashed bundle names.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxied server-side to the camera backend so the browser only ever talks
    # to this container's own origin — no CORS config needed on the CCTV API.
    #
    # cctv.czeros.tech (56.68.52.66) is the real backend — its nginx is the
    # only one actually serving this Flask app. api.czeros.tech was a mistake:
    # it resolves to this same EV VPS (103.20.240.48) and hits an unrelated
    # stale/decoy instance that never receives real camera logins, so every
    # status poll silently looked plausible but never reflected reality.
    resolver 1.1.1.1 valid=30s;
    location /api/ {
        proxy_ssl_server_name on;
        proxy_set_header Host cctv.czeros.tech;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass https://cctv.czeros.tech/api/;

        # The /api/stream/* and /api/admin/stream/* endpoints are
        # effectively-infinite live responses — nginx's default
        # proxy_buffering accumulates the whole thing before forwarding any
        # of it downstream, so the browser sees nothing (StreamScreen sat at
        # "0 chunks, 0.0 KB" forever even though the backend was genuinely
        # sending frames the whole time, confirmed by curling the real
        # backend directly). Disabled so bytes flush through as they arrive.
        # Also raised the read timeout past nginx's 60s default so an idle
        # stream connection isn't killed mid-test.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;
}
